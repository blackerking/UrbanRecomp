# Second recorded play session (disasters, overlays, loans, other
# scenarios), unioned with the first. Same method: targets of executed
# JSR/JSL that the closure still does not cover.
func bank_02_a3f1 a3f1      # 1 executed call site(s)
func bank_02_a64d a64d      # 1 executed call site(s)
func bank_02_a9ad a9ad      # 1 executed call site(s)

# Fourth session: bankruptcy, a lost scenario, gifts, a bank loan --
# failure and reward paths the first three never reached.
func bank_02_ae4a ae4a      # 2 executed call site(s)
func bank_02_b6d0 b6d0      # 1 executed call site(s)

# Measured callee exit widths -- see recomp/bank01.cfg for the method.
# All three corroborated by their direct callers' return-address widths.
exit_mx_at 02a0e8 1 1
exit_mx_at 02a3dc 0 0
exit_mx_at 02a3e0 0 0

# Multi-exit callee: 02:8000 is entered only at m0x0 and returns in m0x1 OR
# m1x1. 02:803C is `JMP $824B` into a shared tail ending at a different RTL
# (02:8374, m0x1) from its own (02:8195, m1x1), so the two exits are real.
#
# The set is taken from the widths measured at the one direct call site's
# return address (01:AB45), not from the union over the shared tail. A wider
# set is not the safe direction here: the decoder forks the post-call
# continuation once per declared width, and decoding at a width the ROM never
# exits in can walk onto a $00 and poison an otherwise-clean node.
exit_mx_set 028000 M0X0 M0X1,M1X1
