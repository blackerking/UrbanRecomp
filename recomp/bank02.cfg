# bank02.cfg -- SimCity (SNES)
#
# Bank declaration only. Following the same LLE-first pattern as bank00.cfg:
# declare the bank so the emitter will consider it, and let the analyzer's
# static reachability closure (v2_analyze.py / v2_emit.py --cfg-roots) prove
# what is AOT-eligible from the architectural roots. Anything it cannot prove
# keeps running correctly on the LLE interpreter tier, which remains the
# correctness baseline for this project.
#
# No per-game addresses or hle_func overrides are declared here. Those belong
# in this file only once identified against SimCity's actual disassembly --
# see docs/ROM_MAP.md and the investigation docs for what has been mapped so
# far (bank $01 = UI/cursor dispatch, $02 = overlay screens, $03 = city
# simulation + scenario/event system).

bank = 2

# Cross-bank JSL target from the map generator at 03:d86d.
func bank_02_923f 923f      # generation scratch clear + DMA upload (JSL wrapper)
func bank_02_9243 9243      # ...body

# Entry points confirmed by EXECUTION, not by static inference: a real
# play session (build, save, load, every window) was recorded with
# SC_PC_BITMAP_BANK=all, and these are addresses that an executed JSR/JSL
# actually called and that the analyzer's closure does not already cover.
func bank_02_b351 b351      # 53 executed call site(s)
func bank_02_b266 b266      # 50 executed call site(s)
func bank_02_b47f b47f      # 10 executed call site(s)
func bank_02_b4b4 b4b4      # 8 executed call site(s)
func bank_02_b2ec b2ec      # 5 executed call site(s)
func bank_02_aa50 aa50      # 3 executed call site(s)
func bank_02_a5a9 a5a9      # 2 executed call site(s)
func bank_02_a8a1 a8a1      # 2 executed call site(s)
func bank_02_a91a a91a      # 2 executed call site(s)
func bank_02_b51f b51f      # 2 executed call site(s)
func bank_02_bc8f bc8f      # 2 executed call site(s)
