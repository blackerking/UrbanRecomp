# bank00.cfg — Urban Recomp, US image
#
# Minimum viable seed, following the same pattern MegaManXSNESRecomp and the
# other snesrecomp game repos start from (see snesrecomp/docs/LLE_FIRST_ANALYSIS.md):
# declare only the architectural entry points and let the analyzer's static
# reachability closure (`v2_analyze.py` / `v2_emit.py --cfg-roots`) discover
# and prove everything demanded from them. Code that the analyzer cannot yet
# prove AOT-eligible keeps running correctly on the LLE interpreter tier —
# that tier, not this file, is the correctness baseline for this bring-up.
#
# No per-game addresses (task scheduler entries, HLE overlays, sprite tables,
# etc.) are declared here yet. Those belong in this file only once they've
# been identified against the game's actual disassembly; until then the
# interpreter runs the real ROM bytes for anything not proven above.

bank = 0

# Read the SNES native vector table (RESET, NMI, IRQ) directly from ROM bytes
# at $00:FFE0-FFFF. This is the only true architectural root every LoROM game
# needs declared; RESET is where cfg-roots analysis starts its closure.
auto_vectors

# Reached through the ROM's `COP #$00` syscall dispatch (A selects the
# service), which the static closure cannot follow, or as cross-bank JSL
# targets. All verified by execution this session -- see docs/ROM_MAP.md.
func bank_00_90dd 90dd      # LC_LZ5 decompressor (COP #$00 with A = 8)
func bank_00_824b 824b      # PRNG entry (JSL wrapper: JSR $824f ; RTL)
func bank_00_824f 824f      # PRNG step: additive generator over $59/$5b
# A cfg `func` with no entry_mx_at defaults to M1X1, and for 926d that width
# is wrong: `A0 00` at 926d is `LDY #$0000` (three bytes) because the routine
# is only ever entered with x=0. Decoded as M1X1 the immediate is one byte,
# decode resumes at 926f, reads `80 48` as `BRA $92b9`, and emits a block
# label at 92b9 -- which is the middle of `DEC $012b,X` at 92b7. The variant
# is dead today (all ten call sites demand M1X0, and the bitmap records only
# m1x0 at 926d), so nothing miscompiles at runtime, but the emitted body is
# garbage and would become live the moment anything routed to it.
#
# Measured, not assumed: `tools/gen_align_check.py` flags the desynchronised
# label by decoding every executed address at its recorded width and checking
# no emitted label lands on a byte the CPU used as an operand.
# NOTE: this must precede the `func` line -- cfg_loader applies entry_mx_at at
# the point the func is parsed, in a single pass over the file.
entry_mx_at 926d 1 0
func bank_00_926d 926d      # decompressor source bank-crossing helper

# COP syscall services. `COP #$00` traps to the COP vector at 00:8211, which
# does `ASL A ; TAX ; JSR ($8223,X)` -- a software-interrupt entry followed by
# an indirect jump through an 11-entry table, so NONE of these services is
# statically reachable, and there are ~309 call sites across the ROM. This is
# the main reason the analysis closure stopped early on this game.
# Table read directly from 00:8223; service 8 is the LC_LZ5 decompressor,
# which independently confirms the decode (`LDA #$0008 ; COP #$00`).
func bank_00_8211 8211      # COP vector: syscall dispatcher
func bank_00_8239 8239      # BRK vector
func bank_00_930d 930d      # COP service 0 (133 call sites), also 5 and 6
func bank_00_86a4 86a4      # COP service 1 (20 call sites)
func bank_00_8ea9 8ea9      # COP service 2 (45 call sites)
func bank_00_8e43 8e43      # COP service 3 (16 call sites)
func bank_00_8e75 8e75      # COP service 4 (19 call sites)
func bank_00_9479 9479      # COP service 7 (1 call site)
func bank_00_8f82 8f82      # COP service 9 (1 call site)
func bank_00_86c8 86c8      # COP service 10 (4 call sites)
func bank_00_823e 823e      # PRNG seed from $c7 into $59/$5b/$5d

# NMI handler. Already an architectural root via auto_vectors -- declaring it
# here changed the root count by zero (71 either way), so this is purely to
# give it a stable name in the emitted C. Confirmed by bsnes trace to be what
# releases 00:930d's vblank spin, via INC $b9 at 00:80bc.
func bank_00_80b2 80b2      # NMI: INC $b9 fast path, then the full handler

