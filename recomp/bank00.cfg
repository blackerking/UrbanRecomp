# ── The frame boundary ───────────────────────────────────────────────────────
#
# 00:930d is COP service 0, this game's wait-for-vblank primitive and the
# most-used service in the ROM (133 call sites):
#
#     SEP #$20 ; STZ $b9 ; INC $c7 ; LDA $b9 ; BEQ -6 ; RTS
#
# It spins until the NMI handler releases it with INC $b9 at 00:80bc. That
# makes it the point where the game hands a frame back, which is exactly what
# snesrecomp/docs/LLE_SCHEDULER.md asks each game to identify ("the only
# per-game knowledge is which PCs are the yield/die primitives") and what
# ar-recomp declares as `hle_func 8418 ActRaiser_WaitForVblank`.
#
# Declaring it does NOT by itself route execution through compiled code -- see
# docs/MIGRATION_step3.md. It is the seam both candidate designs need first.
# hle_func 930d ScHle_WaitForVblank
#
# Disabled for the run_loop frame model. The HLE existed for the FIBER design,
# where it was the only way to hand a frame back from arbitrary call depth. The
# bridge detects the same wait itself via yield_pc (00:9311 on $b9), but only
# in INTERPRETED code -- an HLE'd 00:930d in a compiled body returns
# immediately and the frame is never paced. See MIGRATION_step3 §19.

# ATTEMPTED and REMOVED: `indirect_dispatch 821e 11 ptrcall ... targets:...`
# parses fine and changes nothing. The native analyzer only consults
# indirect_dispatch for JMP-indirect sites (recompiler-rs/src/decoder.rs:
# `if insn.mnem == "JMP" && (Mode::Indir | Mode::IndirX)`), and 00:821e is
# `fc 23 82` = JSR ($8223,X), opcode $FC. Both of this ROM's dispatchers are
# JSR-indirect, so the directive cannot reach either. A cfg line that silently
# does nothing is worse than no line, so it is not kept here.
# Recorded in docs/UPSTREAM_cop_syscall.md.

# Measured callee exit width -- see the block in recomp/bank01.cfg for the
# method (docs/OPEN_QUESTIONS.md A1/F).
exit_mx_at 008061 0 0       # RTS in m0x0; caller return corroborates (m1x0 -> m0x0)

# Multi-exit callee: 00:C3F9 is entered at m0x0 and returns in m0x0 OR m0x1
# depending on the path, so no single exit_mx_at can be right for it (both of
# its executed RTS/RTL are measured, and its one direct caller resumes in
# both widths). See docs/OPEN_QUESTIONS.md F7.
exit_mx_set 00c3f9 M0X0 M0X0,M0X1

# The save/load dialog prompts (text_tool.py saveload). Each of these draws
# "Which to load?", "Where to save?" or "save?" by copying a run of tiles
# out of the sheet $0B:86F7: LDA #$9000+tile*32 / LDX #count / JSR $CB12.
# The German and French cartridges use other runs, in a longer sheet, so a
# translation changes those operands -- which AOT bodies carry as constants.
# Exits declared, or the $01DF menu handlers that call them drop too:
# 00:c7da returns from 00:c82c in m0x0 and from 00:c8cd in m0x1 (REP #$20
# after SEP #$30); the other three return in m0x0 everywhere.
force_lle 00C7DA
force_lle 00C8DA
force_lle 00C941
force_lle 00C9EF
exit_mx_set 00c7da M0X0 M0X0,M0X1
exit_mx_set 00c7da M1X1 M0X0,M0X1
exit_mx_at 00c8da 0 0
exit_mx_at 00c941 0 0
exit_mx_at 00c9ef 0 0
