# bank00.cfg — SimCity (SNES)
#
# Minimum viable seed, following the same pattern MegaManXSNESRecomp and the
# other snesrecomp game repos start from (see snesrecomp/docs/LLE_FIRST_ANALYSIS.md):
# declare only the architectural entry points and let the analyzer's static
# reachability closure (`v2_analyze.py` / `v2_emit.py --cfg-roots`) discover
# and prove everything demanded from them. Code that the analyzer cannot yet
# prove AOT-eligible keeps running correctly on the LLE interpreter tier —
# that tier, not this file, is the correctness baseline for this bring-up.
#
# No per-game addresses (task scheduler entries, HLE overlays, sprite tables,
# etc.) are declared here yet. Those belong in this file only once they've
# been identified against SimCity's actual disassembly; until then the
# interpreter runs the real ROM bytes for anything not proven above.

bank = 0

# Read the SNES native vector table (RESET, NMI, IRQ) directly from ROM bytes
# at $00:FFE0-FFFF. This is the only true architectural root every LoROM game
# needs declared; RESET is where cfg-roots analysis starts its closure.
auto_vectors
