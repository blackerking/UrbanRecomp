# bank03.cfg -- SimCity (SNES)
#
# Bank declaration only. Following the same LLE-first pattern as bank00.cfg:
# declare the bank so the emitter will consider it, and let the analyzer's
# static reachability closure (v2_analyze.py / v2_emit.py --cfg-roots) prove
# what is AOT-eligible from the architectural roots. Anything it cannot prove
# keeps running correctly on the LLE interpreter tier, which remains the
# correctness baseline for this project.
#
# No per-game addresses or hle_func overrides are declared here. Those belong
# in this file only once identified against SimCity's actual disassembly --
# see docs/ROM_MAP.md and the investigation docs for what has been mapped so
# far (bank $01 = UI/cursor dispatch, $02 = overlay screens, $03 = city
# simulation + scenario/event system).

bank = 3

