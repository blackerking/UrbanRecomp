# bank01.cfg -- SimCity (SNES)
#
# Bank declaration only. Following the same LLE-first pattern as bank00.cfg:
# declare the bank so the emitter will consider it, and let the analyzer's
# static reachability closure (v2_analyze.py / v2_emit.py --cfg-roots) prove
# what is AOT-eligible from the architectural roots. Anything it cannot prove
# keeps running correctly on the LLE interpreter tier, which remains the
# correctness baseline for this project.
#
# No per-game addresses or hle_func overrides are declared here. Those belong
# in this file only once identified against SimCity's actual disassembly --
# see docs/ROM_MAP.md and the investigation docs for what has been mapped so
# far (bank $01 = UI/cursor dispatch, $02 = overlay screens, $03 = city
# simulation + scenario/event system).

bank = 1

# Jump-table targets and confirmed JSR entry points. The analyzer's closure
# follows only statically resolvable calls, so indirect dispatch through this
# ROM's jump tables (e.g. 01:897f's `JSR ($88ef,X)`) terminates it. These are
# entries verified by live tracing during the investigations in docs/ --
# declaring them lets the closure continue past the indirect edge.
func bank_01_897f 897f      # $c5 reason-code dispatcher (JSR ($88ef,X))
func bank_01_8d26 8d26      # reason-1 handler: cursor sprite + direction dispatch
func bank_01_8c55 8c55      # reason-code computation ($d7==1 path)
func bank_01_afbe afbe      # per-direction map scroll ladder ($01bd/$01bf)
func bank_01_afe0 afe0      # scroll-register update ($0137/$0139) from $01c1
func bank_01_b030 b030      # draw new map column (edge check)
func bank_01_b166 b166      # draw new map column (opposite edge)
func bank_01_b375 b375      # cursor/scroll clamp
func bank_01_c0dd c0dd      # per-frame no-button cursor path
func bank_01_c434 c434      # cursor bounds check
func bank_01_c616 c616      # cursor OAM composition
func bank_01_dd76 dd76      # message window palette fetch
