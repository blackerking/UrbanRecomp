# ── Measured callee exit widths (docs/OPEN_QUESTIONS.md A1/F) ───────────────
#
# An unpublished exit M/X truncates every caller transitively, and the solver
# has no fixed point for these because bank 01's UI handlers dispatch to each
# other in a cycle -- each is unproven because the others are. The machine has
# no such problem, so the width is measured rather than proven:
# `SC_MX_BITMAP` records the executed-PC bitmap split by the live (m,x), and
# the width at a routine's own RTS *is* its exit width, with none of the
# attribution ambiguity of reading a caller's return address (44 of the 60
# call sites here are `JSR (abs,X)`, whose target is picked at runtime).
#
# `tools/mx_exit_propose.py` emits these and only proposes a routine when
# every executed return point was measured and they all agree; it rejects
# 00:C3F9 and 02:A3E0 as genuinely split, and 02:8000 as measured at only one
# of its four return points. Derived independently from two disjoint halves of
# an 18-run recording, which produced identical directives, and re-checked
# after regeneration by `tools/mx_exit_check.py`.
#
# These remain measurements, not proofs -- an unexercised path could exit
# differently. The AOT-vs-interpreter differential is the backstop.
exit_mx_at 01940f 1 0       # $c5 reason-code handler 10; RTS at 01:9466 in m1x0

# Reached only once the scripted input used the runner's *serial* button
# order (B=$0001 .. R=$0800). An earlier round of headless runs drove the
# pad with the $4218/$4219 word layout instead, where B/Y/Select/Start land
# on bits 12-15 -- not button bits at all -- so those four were never
# actually pressed and the UI state machine never advanced. With the correct
# masks these two became measurable. See mstan/snesrecomp#17.
exit_mx_at 019d6b 0 0       # $c5 reason-code handler 5; RTS in m0x0
exit_mx_at 01a97c 0 0       # $01df UI handler; RTS in m0x0 -- unblocks 12 nodes


# The $01df UI state machine -- the mutually recursive dispatch cycle that
# defeats the solver (A1/C3). Each handler was unprovable because the other
# four were; the machine simply runs them, and all five exit m0x0.
#
# Measured at each routine's own RTS/RTL, bounded by the next entry address
# rather than by the node's max_pc24 -- 01:AAD5 physically contains 01:AC0E
# and 01:AC23, whose returns are not its own, and 01:AC0E is truncated short
# of its real return at AC22. Reached with correctly-masked input plus two
# recorded play sessions; every executed return point of all five is
# measured.
exit_mx_at 01a886 0 0
exit_mx_at 01aa39 0 0
exit_mx_at 01aad5 0 0
exit_mx_at 01ad54 0 0       # both returns (01:ADE8 RTL, 01:AE25 RTS) measured m0x0

# Exposed once 02:8000 was declared and decode could continue past it.
# Single return, measured m1x1, and its one direct caller resumes in m1x1 too.
exit_mx_at 01ad04 1 1

# Reached only once a run was long enough for an in-game year to elapse: the
# whole surrounding path is the annual budget dialog, gated on $0dc3 (the
# budget busy flag, 03:8EC8) via $0bcb. A year is 9,600 frames and the earlier
# hunts were 2,600, so they could not have found it. See OPEN_QUESTIONS F10.
exit_mx_at 01ac0e 0 0       # RTS 01:AC22 in m0x0; caller corroborates

# The $01fb == 7 branch of the UI menu: the View mode (tilted Mode 7 map),
# locked behind $01e7 bit 1 -- see docs/ROM_MAP.md. Every earlier hunt ran
# from save states where View was locked, so 01:AC28 was unreachable by
# construction rather than by bad luck. Captured from a session that loaded a
# scenario state (View unlocked at init by 03:C687) and opened it.
#
# Genuinely two-exit from one entry variant: 01:ACCF returns m0x1 and 01:AD03
# returns m0x0. All three executed return points are measured.
exit_mx_set 01ac23 M0X0 M0X0,M0X1

# 01:f1ed -- the map generator, replaced by the decompiled one in
# src/simcity_mapgen.c. See SimCity_MapGen in src/simcity_hle.c.
#
# This is inert unless SC_FIBER=1: hle_func only applies to AOT-linked bodies,
# and the interpreter path runs the ROM's own code. So the default build is
# unaffected and this is opt-in, which is what the fiber switch is for.
#
# The substitution is bit-exact, not approximate -- three maps across both
# generator branches reproduce the guest's map on all 12000 cells and leave the
# PRNG in its exact final state. The routine it replaces takes the SNES CPU
# about 800 frames.
hle_func f1ed SimCity_MapGen

# Kept on the interpreter so a translation can move the panel copy lists
# (text_tool.py panels). The long operand of LDA $03E5CF,X and the LDA #$03
# before PLB name the bank the table and lists live in; the German lists are
# longer than bank 03 has room for, so an import moves both to bank 0F and
# repoints those operands -- which AOT bodies carry as C constants. It runs
# once per panel page. Declared with its exit width, or its callers would drop
# to the interpreter too (both returns, 01:d77c and 01:d7d3, are m0x0).
force_lle 01D729
exit_mx_at 01d729 0 0
