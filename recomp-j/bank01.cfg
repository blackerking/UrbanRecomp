# bank01.cfg -- Urban Recomp, JAPAN image
#
# Minimal seed. The US cfgs in recomp/ encode US addresses derived from months
# of analysis and do NOT transfer: J shares the vectors and a handful of
# routines with U (00:8211, 00:80b2, 03:b8ae) but only 26% of 1KB chunks match,
# so every hand-declared `func` here would be a guess.
#
# So this declares the bank and nothing else, exactly as the US repo started,
# and lets the static closure from the architectural roots prove what it can.
# See docs/REGIONS.md.

bank = 1
